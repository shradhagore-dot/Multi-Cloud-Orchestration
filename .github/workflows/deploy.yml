name: Cloud-to-Edge Kubernetes Orchestrator

on:
  push:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Create Terraform Config
        run: |
          USER_DATA_B64=$(printf '#!/bin/bash\ncurl -sfL https://k3s.io | sh -\nsleep 20\nkubectl create deployment edge-web-app --image=nginxdemos/hello:latest --replicas=2\nkubectl expose deployment edge-web-app --type=NodePort --port=80 --target-port=80\nkubectl patch svc edge-web-app -p '\''{"spec":{"ports":[{"port":80,"nodePort":30080}]}}'\''\n' | base64 -w 0)
          cat << 'EOF' > main.tf
          terraform {
            required_providers {
              aws = { source = "hashicorp/aws", version = "~> 5.0" }
            }
          }
          provider "aws" { region = "us-east-1" }

          resource "aws_security_group" "k8s_edge_sg" {
            name = "k8s-edge-orchestrator-sg"
            ingress {
              from_port   = 30080
              to_port     = 30080
              protocol    = "tcp"
              cidr_blocks = ["0.0.0.0/0"]
            }
            ingress {
              from_port   = 80
              to_port     = 80
              protocol    = "tcp"
              cidr_blocks = ["0.0.0.0/0"]
            }
            egress {
              from_port   = 0
              to_port     = 0
              protocol    = "-1"
              cidr_blocks = ["0.0.0.0/0"]
            }
          }

          data "aws_ami" "ubuntu" {
            most_recent = true
            owners      = ["099720109477"]
            filter {
              name   = "name"
              values = ["ubuntu/images/hvm-ssd/ubuntu-jammy-22.04-amd64-server-*"]
            }
          }

          resource "aws_instance" "k8s_master_node" {
            ami                    = data.aws_ami.ubuntu.id
            instance_type          = "t3.micro"
            vpc_security_group_ids = [aws_security_group.k8s_edge_sg.id]
            user_data_base64       = "REPLACE_USER_DATA"
            tags = { Name = "K8s-Edge-Orchestrator-Node" }
          }

          resource "aws_cloudfront_distribution" "k8s_edge_cdn" {
            enabled = true
            comment = "Edge Layer for Kubernetes Cluster"
            origin {
              domain_name = aws_instance.k8s_master_node.public_dns
              origin_id   = "k8s-origin"
              custom_origin_config {
                http_port              = 30080
                https_port             = 443
                origin_protocol_policy = "http-only"
                origin_ssl_protocols   = ["TLSv1.2"]
              }
            }
            default_cache_behavior {
              allowed_methods        = ["GET", "HEAD"]
              cached_methods         = ["GET", "HEAD"]
              target_origin_id       = "k8s-origin"
              viewer_protocol_policy = "redirect-to-https"
              forwarded_values {
                query_string = false
                cookies { forward = "none" }
              }
            }
            restrictions {
              geo_restriction { restriction_type = "none" }
            }
            viewer_certificate {
              cloudfront_default_certificate = true
            }
          }

          output "direct_kubernetes_url" {
            value = "http://${aws_instance.k8s_master_node.public_ip}:30080"
          }
          output "global_edge_https_url" {
            value = "https://${aws_cloudfront_distribution.k8s_edge_cdn.domain_name}"
          }
          EOF
          sed -i "s|REPLACE_USER_DATA|$USER_DATA_B64|g" main.tf

      - name: Provision AWS, Kubernetes & Edge CDN
        run: |
          terraform init
          terraform apply -auto-approve
